image: docker:latest

services:
  - docker:dind

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - docker buildx build -t codeql-light -f Dockerfile.light

deploy:
  stage: deploy
  image: codeql-light:latest
  before_script:
    - mkdir -p /tools/codeql
  script:
    - cp -r /root/codeql-home/codeql /tools/codeql
    - cp -r /opt/codeql-scripts /tools/codeql
  after_script:
    - ls -lia /tools/codeql
