services:
  codeql-java-8:
    build: 
      context: .  # Build the image from the current directory (context)
      dockerfile: Dockerfile-java-8  # Specify the Dockerfile name
    image: codeql-agent-java-8
    volumes:
      - jdkvol8:/opt/jdk  # Mount a pre-existing JDK volume
      - mavenvol8:/opt/maven  # Mount a pre-existing Maven volume
    command: ["sleep", "30"]  # Execute sleep command for 30 seconds
    stop_grace_period: 0s 

  codeql-java-11:
    build: 
      context: .  # Build the image from the current directory (context)
      dockerfile: Dockerfile-java-11  # Specify the Dockerfile name
    image: codeql-agent-java-11
    volumes:
      - jdkvol11:/opt/jdk  # Mount a pre-existing JDK volume
      - mavenvol11:/opt/maven  # Mount a pre-existing Maven volume
    command: ["sleep", "30"]  # Execute sleep command for 30 seconds
    stop_grace_period: 0s 

  codeql-java-17:
    build: 
      context: .  # Build the image from the current directory (context)
      dockerfile: Dockerfile-java-17  # Specify the Dockerfile name
    image: codeql-agent-java-17
    volumes:
      - jdkvol17:/opt/jdk  # Mount a pre-existing JDK volume
      - mavenvol17:/opt/maven  # Mount a pre-existing Maven volume
    command: ["sleep", "30"]  # Execute sleep command for 30 seconds
    stop_grace_period: 0s 

  # codeql-java-21:
